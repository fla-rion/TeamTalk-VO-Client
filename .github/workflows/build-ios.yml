name: iOS Build

on:
  push:
    branches: [ios-app]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version-Tag'
        required: false
        default: 'manual'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode-Version wählen
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: xcodegen installieren
        run: brew install xcodegen

      - name: Version aus app_wx.py lesen
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          with open('src/app_wx.py', encoding='utf-8') as f:
              content = f.read()
          m = re.search(r'APP_VERSION\s*=\s*[\"\']([\w.]+)[\"\']', content)
          print(m.group(1) if m else '1.0.0')
          " 2>/dev/null || echo "1.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "iOS App Version: $VERSION"

      - name: TeamTalk5 iOS xcframework herunterladen
        run: |
          mkdir -p ios/Vendor/TeamTalk
          if [ -n "${{ secrets.TEAMTALK_IOS_URL }}" ]; then
            curl -L "${{ secrets.TEAMTALK_IOS_URL }}" -o /tmp/tt5ios.zip
            unzip -q /tmp/tt5ios.zip -d /tmp/tt5ios/
            find /tmp/tt5ios -name "TeamTalk5.xcframework" -exec cp -r {} ios/Vendor/TeamTalk/ \;
            echo "TeamTalk5.xcframework eingebunden."
          else
            echo "WARNUNG: Kein TEAMTALK_IOS_URL-Secret – Build ohne echtes SDK (Simulator only)."
            mkdir -p ios/Vendor/TeamTalk/TeamTalk5.xcframework
            printf '{"CFBundlePackageType":"XFWK","XCFrameworkFormatVersion":"1.0","AvailableLibraries":[]}' \
              > ios/Vendor/TeamTalk/TeamTalk5.xcframework/Info.plist
          fi

      - name: Xcode-Projekt generieren
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: iOS App bauen (Simulator)
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project TeamTalkVO.xcodeproj \
            -scheme TeamTalkVO \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/xcodebuild.log | tail -30
          echo "build_log=ios/build/xcodebuild.log" >> "$GITHUB_OUTPUT"

      - name: Simulator-App als ZIP paketieren
        id: artifact
        run: |
          mkdir -p dist
          APP=$(find ios/build/DerivedData -name "TeamTalkVO.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "TeamTalkVO.app" -type d 2>/dev/null | head -1)
          fi
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="TeamTalk-VO-${VERSION}-ios-simulator.zip"
          if [ -n "$APP" ]; then
            (cd "$(dirname "$APP")" && zip -r "$GITHUB_WORKSPACE/dist/$ARTIFACT" "$(basename "$APP")")
            echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Paketiert: dist/$ARTIFACT ($(du -h "dist/$ARTIFACT" | cut -f1))"
          else
            echo "WARNUNG: App-Bundle nicht gefunden."
            find ios/build -type d -name "*.app" 2>/dev/null || true
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release erstellen
        if: steps.artifact.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "TeamTalk VO ${{ steps.version.outputs.version }} (iOS)"
          body: |
            iOS Simulator-Build für Version ${{ steps.version.outputs.version }}.

            **Hinweise:**
            - Dies ist ein Simulator-Build (kein echtes Gerät)
            - Für Gerätebetrieb: TeamTalk5.xcframework + Code-Signing erforderlich
            - Echtes SDK einbinden: `TEAMTALK_IOS_URL`-Secret setzen

            **Installation (Simulator):**
            1. Xcode + iOS Simulator installieren
            2. ZIP entpacken
            3. `xcrun simctl install booted TeamTalkVO.app`
          files: dist/${{ steps.artifact.outputs.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
