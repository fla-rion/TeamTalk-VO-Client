name: macOS Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenes Release, in das die macOS-Dateien hochgeladen werden (z. B. v11.2.2); leer = nur bauen"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: librespot-Cache laden
        id: librespot-cache
        uses: actions/cache@v4
        with:
          path: third_party/librespot
          key: librespot-macos-${{ hashFiles('scripts/download_librespot.py') }}

      - name: librespot bauen
        if: steps.librespot-cache.outputs.cache-hit != 'true'
        run: python scripts/download_librespot.py

      - name: TeamTalk SDK (macOS) herunterladen
        run: |
          brew install p7zip || true
          mkdir -p third_party/teamtalk
          cd third_party/teamtalk
          curl -sL -o sdk.7z "https://bearware.dk/teamtalksdk/v5.19a/tt5sdk_v5.19a_macos_universal.7z"
          7z x -y sdk.7z
          rm sdk.7z

      - name: SRAL bauen (libSRAL.dylib)
        run: |
          git clone https://github.com/m1maker/SRAL /tmp/SRAL
          cmake /tmp/SRAL -B /tmp/SRAL/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_SRAL_TEST=OFF
          cmake --build /tmp/SRAL/build --config Release
          mkdir -p third_party/sral/macOS
          cp /tmp/SRAL/build/libSRAL.dylib third_party/sral/macOS/libSRAL.dylib
          cp /tmp/SRAL/Bindings/Python/sral.py third_party/sral/sral.py

      - name: Abhängigkeiten installieren
        run: |
          brew install portaudio || true
          python -m pip install --upgrade pip
          pip install -r requirements_macos.txt

      - name: Version aus app_wx.py lesen
        id: version
        shell: python
        run: |
          import re, os
          with open("src/app_wx.py", encoding="utf-8") as f:
              content = f.read()
          m = re.search(r'APP_VERSION\s*=\s*["\']([^"\']+)["\']', content)
          version = m.group(1) if m else "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")

      - name: openevv aus Quellcode bauen
        run: python scripts/download_openevv.py

      - name: PyInstaller Build
        run: |
          pyinstaller -y "TeamTalk VO Client.spec"

      - name: App-Bundle neu signieren
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          # Das .spec-Skript schreibt nach dem PyInstaller-BUNDLE-Schritt noch
          # .lproj-Stubs ins Resources-Verzeichnis. Das bricht die von
          # PyInstaller gesetzte ad-hoc-Signatur (Gatekeeper meldet dann
          # "App ist beschädigt"). Deshalb hier das komplette Bundle neu
          # signieren, nachdem alle Dateien final an Ort und Stelle sind.
          #
          # Mit festem Zertifikat (Secret MACOS_SIGN_P12, erzeugt mit
          # scripts/create_signing_cert.sh): Die Designated Requirement lautet
          # dann "identifier … and certificate leaf = H…" und bleibt über alle
          # Builds gleich – macOS behält erteilte Rechte (Mikrofon,
          # Bedienungshilfen, Spracherkennung) nach Updates. Ad-hoc-Signaturen
          # binden die Rechte an den cdhash, der sich bei jedem Build ändert.
          app="dist/TeamTalk VO Client.app"
          xattr -cr "$app"
          if [ -n "$MACOS_SIGN_P12" ]; then
            kc="$RUNNER_TEMP/sign.keychain-db"
            kcpw="$(openssl rand -hex 16)"
            echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
            rm -f "$RUNNER_TEMP/sign.p12"
            # Schlüsselbund in die Suchliste aufnehmen – sonst findet codesign
            # die Identität nicht ("no identity found"), obwohl sie importiert ist
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            # Über den SHA-1-Fingerabdruck signieren: Ein selbst signiertes
            # Zertifikat gilt nicht als "valid", der Name allein reicht codesign dann nicht
            identity=$(security find-identity -p codesigning "$kc" | awk '/TeamTalk VO Client Signing/ {print $2; exit}')
            if [ -z "$identity" ]; then
              security find-identity -p codesigning "$kc"
              echo "::error::Signatur-Identität nicht gefunden"; exit 1
            fi
            codesign --force --deep --keychain "$kc" --sign "$identity" "$app"
          else
            echo "::warning::Kein Signatur-Zertifikat (Secret MACOS_SIGN_P12) – ad-hoc signiert, macOS fragt nach Updates erneut nach Rechten"
            codesign --force --deep --sign - "$app"
          fi
          codesign -dv --verbose=4 "$app"
          codesign -dr - "$app"
          spctl -a -vv "$app" || true

      - name: DMG erstellen
        run: |
          version="${{ steps.version.outputs.version }}"
          dmg_name="TeamTalk-VO-Client-${version}-macOS.dmg"
          hdiutil create -volname "TeamTalk VO Client ${version}" \
            -srcfolder "dist/TeamTalk VO Client.app" \
            -ov -format UDZO "dist/$dmg_name"
          echo "DMG_NAME=$dmg_name" >> "$GITHUB_ENV"

      - name: Installationspaket (.pkg) erstellen
        run: |
          version="${{ steps.version.outputs.version }}"
          pkg_name="TeamTalk-VO-Client-${version}-macOS.pkg"
          # Installiert nach /Applications; Update über die App startet dieses Paket
          pkgbuild --component "dist/TeamTalk VO Client.app" \
            --install-location /Applications \
            --identifier cc.leons.flarion.teamtalkvoclient \
            --version "$version" "dist/$pkg_name"
          echo "PKG_NAME=$pkg_name" >> "$GITHUB_ENV"

      - name: GitHub Release erstellen und DMG hochladen
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "TeamTalk VO Client ${{ steps.version.outputs.version }}"
          append_body: true
          body: |
            macOS-Build für Version ${{ steps.version.outputs.version }}.

            **Installation:** Paket (.pkg) öffnen und dem Installer folgen – oder DMG mounten und die App in den Programme-Ordner ziehen.
          files: |
            dist/${{ env.PKG_NAME }}
            dist/${{ env.DMG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gitea Release synchronisieren
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          base="https://git.leons.cc/api/v1/repos/flarion/TeamTalk-VO-Client"
          token="${GITEA_TOKEN}"

          _parse_id() { python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true; }

          release_id=$(curl -s -H "Authorization: token $token" "$base/releases/tags/$tag" | _parse_id)

          if [[ -z "$release_id" || "$release_id" == "None" ]]; then
            echo "Gitea-Release $tag nicht gefunden – erstelle..."
            release_id=$(curl -s -X POST "$base/releases" \
              -H "Authorization: token $token" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"body\":\"macOS-Build $tag\",\"draft\":false,\"prerelease\":false}" \
              | _parse_id)
          fi

          if [[ -z "$release_id" || "$release_id" == "None" ]]; then
            echo "Gitea-Release konnte nicht erstellt werden (Tag fehlt auf Gitea?) – überspringe Upload"
            exit 0
          fi
          echo "Gitea-Release ID: $release_id"

          existing=$(curl -s -H "Authorization: token $token" "$base/releases/$release_id/assets" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if any(a['name']=='$DMG_NAME' for a in d) else 'no')" 2>/dev/null || echo "no")

          if [[ "$existing" == "yes" ]]; then
            echo "$DMG_NAME bereits auf Gitea vorhanden – überspringe Upload"
            exit 0
          fi

          echo "Lade $DMG_NAME auf Gitea hoch (Release $release_id)..."
          # Ein grosser Upload, den Gitea wegen seines Body-Size-Limits
          # mitten im Transfer abbricht, laesst curl selbst mit einem
          # Fehler-Exitcode enden (nicht nur mit einem 4xx/5xx); unter
          # `set -e` wuerde das den ganzen (bewusst best-effort) Sync-Schritt
          # und damit den Job scheitern lassen. "000" faellt unten sauber
          # in den Warnungs-Zweig statt das Skript abzubrechen.
          http_code=$(curl -s -o /tmp/gitea_upload_resp.json -w "%{http_code}" -X POST "$base/releases/$release_id/assets" \
            -H "Authorization: token $token" \
            -F "attachment=@dist/$DMG_NAME" || echo "000")
          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "Gitea-Upload erfolgreich (HTTP $http_code)."
          else
            echo "::warning::Gitea-Upload von $DMG_NAME fehlgeschlagen (HTTP $http_code) – vermutlich Server-seitiges Body-Size-Limit auf git.leons.cc (~100 MB). Datei ist nur auf GitHub verfügbar."
            cat /tmp/gitea_upload_resp.json 2>/dev/null || true
          fi
