name: macOS Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: librespot-Cache laden
        id: librespot-cache
        uses: actions/cache@v4
        with:
          path: third_party/librespot
          key: librespot-macos-${{ hashFiles('scripts/download_librespot.py') }}

      - name: librespot bauen
        if: steps.librespot-cache.outputs.cache-hit != 'true'
        run: python scripts/download_librespot.py

      - name: TeamTalk SDK (macOS) herunterladen
        run: |
          brew install p7zip || true
          mkdir -p third_party/teamtalk
          cd third_party/teamtalk
          curl -sL -o sdk.7z "https://bearware.dk/teamtalksdk/v5.19a/tt5sdk_v5.19a_macos_universal.7z"
          7z x -y sdk.7z
          rm sdk.7z

      - name: SRAL bauen (libSRAL.dylib)
        run: |
          git clone https://github.com/m1maker/SRAL /tmp/SRAL
          cmake /tmp/SRAL -B /tmp/SRAL/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBUILD_SRAL_TEST=OFF
          cmake --build /tmp/SRAL/build --config Release
          mkdir -p third_party/sral/macOS
          cp /tmp/SRAL/build/libSRAL.dylib third_party/sral/macOS/libSRAL.dylib
          cp /tmp/SRAL/Bindings/Python/sral.py third_party/sral/sral.py

      - name: Abhängigkeiten installieren
        run: |
          brew install portaudio || true
          python -m pip install --upgrade pip
          pip install -r requirements_macos.txt

      - name: Version aus app_wx.py lesen
        id: version
        shell: python
        run: |
          import re, os
          with open("src/app_wx.py", encoding="utf-8") as f:
              content = f.read()
          m = re.search(r'APP_VERSION\s*=\s*["\']([^"\']+)["\']', content)
          version = m.group(1) if m else "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")

      - name: openevv aus Quellcode bauen
        run: python scripts/download_openevv.py

      - name: PyInstaller Build
        run: |
          pyinstaller -y "TeamTalk VO Client.spec"

      - name: DMG erstellen
        run: |
          version="${{ steps.version.outputs.version }}"
          dmg_name="TeamTalk-VO-Client-${version}-macOS.dmg"
          hdiutil create -volname "TeamTalk VO Client ${version}" \
            -srcfolder "dist/TeamTalk VO Client.app" \
            -ov -format UDZO "dist/$dmg_name"
          echo "DMG_NAME=$dmg_name" >> "$GITHUB_ENV"

      - name: GitHub Release erstellen und DMG hochladen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "TeamTalk VO Client ${{ steps.version.outputs.version }}"
          append_body: true
          body: |
            macOS-Build für Version ${{ steps.version.outputs.version }}.

            **Installation:** DMG mounten und App in den Programme-Ordner ziehen.
          files: dist/${{ env.DMG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gitea Release synchronisieren
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -e
          tag="${GITHUB_REF_NAME}"
          base="https://git.garogaming.xyz/api/v1/repos/flarion/TeamTalk-VO-Client"
          token="${GITEA_TOKEN}"

          release_id=$(curl -s -H "Authorization: token $token" "$base/releases/tags/$tag" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)

          if [[ -z "$release_id" || "$release_id" == "None" ]]; then
            echo "Gitea-Release $tag nicht gefunden – erstelle..."
            release_id=$(curl -s -X POST "$base/releases" \
              -H "Authorization: token $token" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"body\":\"macOS-Build $tag\",\"draft\":false,\"prerelease\":false}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          fi
          echo "Gitea-Release ID: $release_id"

          existing=$(curl -s -H "Authorization: token $token" "$base/releases/$release_id/assets" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if any(a['name']=='$DMG_NAME' for a in d) else 'no')")

          if [[ "$existing" == "yes" ]]; then
            echo "$DMG_NAME bereits auf Gitea vorhanden – überspringe Upload"
            exit 0
          fi

          echo "Lade $DMG_NAME auf Gitea hoch (Release $release_id)..."
          curl -s -X POST "$base/releases/$release_id/assets" \
            -H "Authorization: token $token" \
            -F "attachment=@dist/$DMG_NAME"
