name: Android Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java 17 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android Build-Tools und Plattform installieren
        run: |
          sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toga toga-android rubicon-java

      - name: Version aus app_wx.py lesen
        id: version
        shell: python
        run: |
          import re, os
          with open("src/app_wx.py", encoding="utf-8") as f:
              content = f.read()
          m = re.search(r'APP_VERSION\s*=\s*["\']([^"\']+)["\']', content)
          version = m.group(1) if m else "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")

      - name: TeamTalk5.aar herunterladen
        # Das AAR wird aus TEAMTALK_AAR_URL bezogen (Repository-Secret).
        # Anleitung zum Beschaffen: libs/README.libs.md
        run: |
          mkdir -p libs
          if [ -n "${{ secrets.TEAMTALK_AAR_URL }}" ]; then
            curl -L "${{ secrets.TEAMTALK_AAR_URL }}" -o libs/TeamTalk5.aar
            echo "TeamTalk5.aar heruntergeladen ($(du -h libs/TeamTalk5.aar | cut -f1))"
          else
            echo "WARNUNG: Kein TEAMTALK_AAR_URL-Secret – Build wird ohne AAR versucht."
          fi

      - name: Keystore dekodieren
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore dekodiert."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Kein Keystore-Secret – unsigniertes APK."
          fi

      - name: Android App bauen
        run: briefcase build android --no-input

      - name: Android App signieren und paketieren
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            briefcase package android \
              --no-input \
              -C "android.sign.key_alias=$KEY_ALIAS" \
              -C "android.sign.key_password=$KEY_PASSWORD" \
              -C "android.sign.store_password=$STORE_PASSWORD" \
              -C "android.sign.store_file=$KEYSTORE_PATH"
          else
            briefcase package android --no-input
          fi

      - name: APK umbenennen und in dist/ ablegen
        id: apk
        run: |
          mkdir -p dist
          APK=$(find build -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -not -path "./dist/*" | head -1)
          fi
          VERSION="${{ steps.version.outputs.version }}"
          APK_NAME="TeamTalk-VO-Client-${VERSION}-android.apk"
          cp "$APK" "dist/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK bereit: dist/$APK_NAME"

      - name: GitHub Release erstellen und APK hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: "TeamTalk VO Client ${{ steps.version.outputs.version }}"
          body: |
            Android-Build für Version ${{ steps.version.outputs.version }}.

            **Installation:**
            1. `${{ steps.apk.outputs.apk_name }}` herunterladen
            2. Einstellungen → Sicherheit → "Unbekannte Quellen" erlauben
            3. APK installieren
          files: dist/${{ steps.apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gitea Release synchronisieren
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_PATH="dist/${{ steps.apk.outputs.apk_name }}"
          BASE="https://git.leons.cc/api/v1/repos/flarion/TeamTalk-VO-Client"

          RELEASE=$(curl -s -H "Authorization: token $GITEA_TOKEN" \
            "$BASE/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Gitea-Release $TAG nicht gefunden – erstelle..."
            BODY=$(python3 -c "import json; print(json.dumps({
              'tag_name':'$TAG','name':'$TAG',
              'body':'Android-Build $TAG','draft':False,'prerelease':False
            }))")
            RELEASE=$(curl -s -X POST "$BASE/releases" \
              -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/json" -d "$BODY")
            RELEASE_ID=$(echo "$RELEASE" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "Gitea-Release nicht erstellbar – überspringe Upload."
            exit 0
          fi

          ASSETS=$(curl -s -H "Authorization: token $GITEA_TOKEN" \
            "$BASE/releases/$RELEASE_ID/assets")
          EXISTING=$(echo "$ASSETS" | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          found = next((a for a in assets if 'android' in a.get('name','')), None)
          print(found['name'] if found else '')
          " 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "APK bereits auf Gitea ($EXISTING) – überspringe."
            exit 0
          fi

          echo "Lade ${{ steps.apk.outputs.apk_name }} auf Gitea hoch..."
          curl -s -X POST "$BASE/releases/$RELEASE_ID/assets" \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@$APK_PATH"
