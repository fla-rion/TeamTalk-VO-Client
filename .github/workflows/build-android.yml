name: Android Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Java 17 (Temurin) einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android Build-Tools und Plattform installieren
        run: |
          sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install briefcase toga toga-android

      - name: Version aus app_wx.py lesen
        id: version
        shell: python
        run: |
          import re, os
          with open("src/app_wx.py", encoding="utf-8") as f:
              content = f.read()
          m = re.search(r'APP_VERSION\s*=\s*["\']([^"\']+)["\']', content)
          version = m.group(1) if m else "unknown"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")

      - name: TeamTalk5.aar herunterladen
        # Das AAR ist nicht im Repo (Lizenz). Es wird aus dem letzten
        # GitHub-Release des eigenen Repos bezogen, wo es als Asset
        # hinterlegt sein muss (manuell hochgeladen nach erstem Build).
        # Alternativ: TEAMTALK_AAR_URL als Repository-Secret setzen.
        run: |
          mkdir -p libs
          if [ -n "${{ secrets.TEAMTALK_AAR_URL }}" ]; then
            curl -L "${{ secrets.TEAMTALK_AAR_URL }}" -o libs/TeamTalk5.aar
          else
            echo "WARNUNG: Kein TEAMTALK_AAR_URL-Secret gesetzt."
            echo "TeamTalk5.aar muss manuell in libs/ abgelegt werden."
            echo "Siehe libs/README.libs.md"
            exit 1
          fi

      - name: Android App bauen
        run: briefcase build android

      - name: Android App signieren
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            briefcase package android \
              --no-input \
              -C "android.sign.key_alias=$ANDROID_KEY_ALIAS" \
              -C "android.sign.key_password=$ANDROID_KEY_PASSWORD" \
              -C "android.sign.store_password=$ANDROID_STORE_PASSWORD" \
              -C "android.sign.store_file=/tmp/release.keystore"
          else
            echo "Kein Keystore-Secret – unsigniertes Debug-APK wird verwendet."
            briefcase package android --no-input
          fi

      - name: APK-Pfad ermitteln
        id: apk
        run: |
          APK=$(find . -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          VERSION="${{ steps.version.outputs.version }}"
          APK_NAME="TeamTalk-VO-Client-${VERSION}-android.apk"
          cp "$APK" "dist/$APK_NAME"
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: GitHub Release erstellen und APK hochladen
        uses: softprops/action-gh-release@v3
        with:
          name: "TeamTalk VO Client ${{ steps.version.outputs.version }}"
          body: |
            Android-Build für Version ${{ steps.version.outputs.version }}.

            **Installation:** APK herunterladen, Installation aus unbekannten
            Quellen in Android erlauben und die APK öffnen.
          files: dist/${{ steps.apk.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gitea Release synchronisieren
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_PATH="dist/${{ steps.apk.outputs.apk_name }}"
          BASE="https://git.leons.cc/api/v1/repos/flarion/TeamTalk-VO-Client"

          # Gitea-Release für diesen Tag holen
          RELEASE=$(curl -s -H "Authorization: token $GITEA_TOKEN" \
            "$BASE/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)

          if [ -z "$RELEASE_ID" ]; then
            echo "Gitea-Release $TAG nicht gefunden – erstelle..."
            BODY=$(python3 -c "import json; print(json.dumps({'tag_name':'$TAG','name':'$TAG','body':'Android-Build $TAG','draft':False,'prerelease':False}))")
            RELEASE=$(curl -s -X POST "$BASE/releases" \
              -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          fi

          if [ -z "$RELEASE_ID" ]; then
            echo "Gitea-Release konnte nicht erstellt/gefunden werden – überspringe Upload."
            exit 0
          fi

          echo "Gitea-Release ID: $RELEASE_ID"

          # Prüfen ob Android-APK schon hochgeladen
          ASSETS=$(curl -s -H "Authorization: token $GITEA_TOKEN" \
            "$BASE/releases/$RELEASE_ID/assets")
          EXISTING=$(echo "$ASSETS" | python3 -c "
          import sys, json
          assets = json.load(sys.stdin)
          found = next((a for a in assets if 'android' in a.get('name','')), None)
          print(found['name'] if found else '')
          " 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Android-APK bereits auf Gitea vorhanden ($EXISTING) – überspringe Upload."
            exit 0
          fi

          echo "Lade ${{ steps.apk.outputs.apk_name }} auf Gitea hoch..."
          curl -s -X POST "$BASE/releases/$RELEASE_ID/assets" \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@$APK_PATH"
