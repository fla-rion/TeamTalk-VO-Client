name: Build openevv (macOS)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: openevv aus Quellcode bauen
        # Nutzt denselben Weg wie der reguläre macOS-App-Build
        # (scripts/download_openevv.py): unser eigener Vendor-Fix-Branch
        # statt Mudb0y/openevv main (vanilla stürzt auf arm64 ab, siehe
        # Kommentare dort) und alle acht unterstützten Sprachen statt nur
        # Englisch.
        run: python3 scripts/download_openevv.py

      - name: evv binary testen
        run: |
          "$GITHUB_WORKSPACE/third_party/openevv/evv" -h

      - name: Binary ins Repo committen
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add third_party/openevv/evv
          if git diff --cached --quiet; then
            echo "Keine Änderung – evv bereits aktuell."
          else
            git commit -m "chore: openevv macOS-Binary (evv) via CI gebaut"
            git push
          fi
