[pytest]
testpaths = tests

# PySide6-Dialogtests (4) brauchen PySide6.QtWidgets; ohne Qt-Bindings werden
# sie durch pytest.importorskip übersprungen.
# Der Apple-Speech-Autorisierungstest benötigt das macOS Speech-Framework.

# urllib3 v2 meldet auf macOS mit LibreSSL eine bekannte TLS-Einschränkung.
# Der Hinweis betrifft die Laufzeitumgebung, nicht die getestete Funktion.
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL.*
