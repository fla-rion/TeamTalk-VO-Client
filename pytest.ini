[pytest]
testpaths = tests

# Die wx-Dialogtests laufen mit den nativen wxPython-Bindings. Der separate
# Apple-Speech-Autorisierungstest wird nur ausgeführt, wenn das Framework da ist.

# urllib3 v2 meldet auf macOS mit LibreSSL eine bekannte TLS-Einschränkung.
# Der Hinweis betrifft die Laufzeitumgebung, nicht die getestete Funktion.
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL.*
